<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Roster Call state flow / 로스터 호출 상태 흐름</title>
  <desc id="desc">Representative transitions from local admission to remote observation, waiting, cancellation, uncertainty, reconciliation, and confirmed terminal states. Node reachability is separate.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#a9b7cc"/></marker>
    <style>
      text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#eaf0fa}
      .heading{font-size:22px;font-weight:750}
      .label{font-size:16px;font-weight:700}
      .small{font-size:13px;fill:#bfccdf}
      .panel{fill:#1b2940;stroke:#425574;stroke-width:1.5}
      .node{fill:#30415d;stroke:#6d8db8;stroke-width:1.5}
      .uncertain{fill:#42334f;stroke:#b087d0;stroke-width:1.5}
      .terminal{fill:#25483f;stroke:#5cae91;stroke-width:1.5}
      .line{fill:none;stroke:#a9b7cc;stroke-width:2;marker-end:url(#arrow)}
      .dashed{fill:none;stroke:#a9b7cc;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="650" rx="22" fill="#111b2b"/>
  <text x="34" y="42" class="heading">CALL STATE · 호출 상태</text>
  <text x="34" y="66" class="small">Representative paths · 주요 경로만 표시 · transition evidence is required / 전이에는 근거 필요</text>

  <rect x="34" y="92" width="1132" height="126" rx="14" class="panel"/>
  <text x="52" y="118" class="label">Local admission · 로컬 접수</text>
  <g class="node">
    <rect x="52" y="141" width="146" height="46" rx="9"/><rect x="242" y="141" width="146" height="46" rx="9"/>
    <rect x="432" y="141" width="146" height="46" rx="9"/><rect x="622" y="141" width="146" height="46" rx="9"/>
  </g>
  <text x="125" y="170" text-anchor="middle" class="label">created</text>
  <text x="315" y="170" text-anchor="middle" class="label">validating</text>
  <text x="505" y="170" text-anchor="middle" class="label">queued</text>
  <text x="695" y="170" text-anchor="middle" class="label">preparing</text>
  <path d="M198 164H235M388 164H425M578 164H615" class="line"/>
  <text x="812" y="155" class="small">No remote send yet · 원격 전송 전</text>
  <text x="812" y="180" class="small">rejected / expired / cancelled</text>

  <rect x="34" y="236" width="1132" height="126" rx="14" class="panel"/>
  <text x="52" y="263" class="label">Remote execution · 원격 실행</text>
  <g class="node">
    <rect x="52" y="283" width="190" height="46" rx="9"/><rect x="310" y="283" width="190" height="46" rx="9"/>
    <rect x="568" y="283" width="190" height="46" rx="9"/>
  </g>
  <text x="147" y="312" text-anchor="middle" class="label">dispatching</text>
  <text x="405" y="312" text-anchor="middle" class="label">accepted</text>
  <text x="663" y="312" text-anchor="middle" class="label">running</text>
  <path d="M242 306H303M500 306H561" class="line"/>
  <text x="790" y="301" class="small">accepted = remote receipt · 원격 접수</text>
  <text x="790" y="325" class="small">running = processing evidence · 처리 관측</text>
  <path d="M695 187V228H147V276" class="line"/>

  <rect x="34" y="382" width="1132" height="134" rx="14" class="panel"/>
  <text x="52" y="408" class="label">Nonterminal branches · 종료되지 않은 분기</text>
  <g class="uncertain">
    <rect x="52" y="430" width="176" height="46" rx="9"/><rect x="260" y="430" width="176" height="46" rx="9"/>
    <rect x="468" y="430" width="176" height="46" rx="9"/><rect x="676" y="430" width="176" height="46" rx="9"/>
  </g>
  <text x="140" y="459" text-anchor="middle" class="label">waiting</text>
  <text x="348" y="459" text-anchor="middle" class="label">cancelling</text>
  <text x="556" y="459" text-anchor="middle" class="label">unknown</text>
  <text x="764" y="459" text-anchor="middle" class="label">reconciling</text>
  <path d="M644 453H669" class="line"/>
  <text x="875" y="445" class="small">Inspect same receipt · 같은 요청 조사</text>
  <text x="875" y="470" class="small">Never auto invoke again · 자동 재호출 금지</text>
  <path d="M663 329V374H140V423M663 329V374H348V423M663 329V374H556V423" class="dashed"/>
  <text x="52" y="499" class="small">waiting → resuming requires provider support (currently unavailable) · 원격 재개는 아직 미지원</text>

  <rect x="34" y="532" width="1132" height="90" rx="14" class="panel"/>
  <text x="52" y="558" class="label">Confirmed terminal · 종료 확인</text>
  <g class="terminal">
    <rect x="52" y="571" width="156" height="36" rx="8"/><rect x="230" y="571" width="156" height="36" rx="8"/>
    <rect x="408" y="571" width="156" height="36" rx="8"/><rect x="586" y="571" width="156" height="36" rx="8"/>
    <rect x="764" y="571" width="156" height="36" rx="8"/>
  </g>
  <text x="130" y="594" text-anchor="middle" class="label">succeeded</text>
  <text x="308" y="594" text-anchor="middle" class="label">failed</text>
  <text x="486" y="594" text-anchor="middle" class="label">cancelled</text>
  <text x="664" y="594" text-anchor="middle" class="label">rejected</text>
  <text x="842" y="594" text-anchor="middle" class="label">expired</text>
  <text x="942" y="582" class="small">ACK ≠ terminal</text>
  <text x="942" y="602" class="small">Node ≠ Call state</text>
</svg>
